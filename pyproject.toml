[project]
name = "personal-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0,<2",
    "cryptography>=42",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "google-genai>=2.20.0,<3",
    "httpx>=0.27",
    "jsonschema>=4.0",
    "openai>=3.3.1,<4",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0.52,<4",
    "PyYAML>=6.0",
    "rich>=14.1.0",
]

[project.optional-dependencies]
observability = ["langfuse>=4.14.5,<5"]
dev = ["markdown-it-py>=4.2.0,<5"]

[project.scripts]
personal-assistant = "personal_assistant.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
    "agent*",
    "agent_skills*",
    "config_service*",
    "llm*",
    "memory*",
    "message_logger*",
    "personal_assistant*",
    "tool_framework*",
]
namespaces = false

[tool.setuptools.package-data]
agent_skills = ["bundled/**/*.md", "bundled/**/*.py"]
personal_assistant = ["console_image/Dockerfile", "console_image/*.py", "browser-requirements.txt"]
